services:
  db:
    image: mysql:8.0
    container_name: helpdesk-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gestion_incidencias}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secretpassword}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secretpassword}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: helpdesk-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gestion_incidencias}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
